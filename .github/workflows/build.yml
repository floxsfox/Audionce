name: Build Audionce APK

# Cara kerja:
# - Jika repo berisi proyek lengkap (ada settings.gradle.kts di root) -> langsung dibuild.
# - Jika repo hanya berisi file .zip proyek (upload dari HP) -> otomatis di-unzip lalu dibuild.
# Hasil: file APK di tab "Releases" (paling gampang diunduh dari HP) dan di "Artifacts" pada halaman run.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Ambil kode repo
        uses: actions/checkout@v4

      - name: Siapkan proyek (otomatis unzip jika yang diupload berupa ZIP)
        id: proj
        shell: bash
        run: |
          set -e
          if [ -f settings.gradle.kts ]; then
            DIR="."
          else
            ZIP=$(ls -1 *.zip 2>/dev/null | head -n 1 || true)
            if [ -z "$ZIP" ]; then
              echo "::error::Tidak ditemukan settings.gradle.kts maupun file .zip proyek di root repo."
              exit 1
            fi
            echo "Mengekstrak $ZIP ..."
            rm -rf _proj
            mkdir _proj
            unzip -q "$ZIP" -d _proj
            S=$(find _proj -name settings.gradle.kts | head -n 1)
            if [ -z "$S" ]; then
              echo "::error::settings.gradle.kts tidak ada di dalam ZIP."
              exit 1
            fi
            DIR=$(dirname "$S")
          fi
          echo "Folder proyek: $DIR"
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Pasang JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Pasang Android SDK
        uses: android-actions/setup-android@v3

      - name: Pasang platform & build-tools
        shell: bash
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" > /dev/null

      - name: Pasang Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build APK (release, sudah ditandatangani)
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: bash
        run: |
          gradle --no-daemon --stacktrace assembleRelease 2>&1 | tee build.log

      - name: Ringkasan error (hanya jika gagal)
        if: failure()
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: bash
        run: |
          {
            echo "## Build gagal"
            echo "Salin teks di bawah ini dan kirim ke Claude:"
            echo '```'
            grep -E "^e: |error:|What went wrong|FAILED" -A3 build.log | head -n 120 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Siapkan file APK
        id: apk
        working-directory: ${{ steps.proj.outputs.dir }}
        shell: bash
        run: |
          APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          NAME="Audionce-build${{ github.run_number }}.apk"
          cp "$APK" "$NAME"
          echo "file=${{ steps.proj.outputs.dir }}/$NAME" >> "$GITHUB_OUTPUT"

      - name: Unggah APK sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: Audionce-APK
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Unggah log build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: ${{ steps.proj.outputs.dir }}/build.log
          if-no-files-found: ignore

      - name: Terbitkan di GitHub Releases (link unduh langsung)
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "build-${{ github.run_number }}-${{ github.run_attempt }}" \
            "${{ steps.apk.outputs.file }}" \
            --target "${{ github.sha }}" \
            --title "Audionce build #${{ github.run_number }}" \
            --notes "APK Audionce build #${{ github.run_number }}. Unduh file .apk di bawah lalu install."
